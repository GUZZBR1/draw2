[tool.pytest.ini_options]
# Num clone limpo, `pytest` roda a suite inteira: testes do app e os
# testes do runner. Antes, um `pytest` sem argumentos dependia do
# diretório e `pytest tests tools/runner/tests` morria na coleta por
# causa de imports de credencial e de arquivos de laboratório.
testpaths = ["tests", "tools/runner/tests"]
norecursedirs = [".venv", ".git", "captures", "models"]
markers = ["lento: testes com threads/tempo real, serializar"]
# O skip dos testes que precisam de arquivo preparado à mão é
# intencional e vem com o motivo; não precisa virar aviso.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 88
# Notebooks trazem código duplicado de células (imports repetidos) e
# não são o alvo do linter de biblioteca.
extend-exclude = [".venv", "notebooks"]

[tool.ruff.format]
# Fontes vendada/gerada: preservar os patches ancorados e a reprodução byte a byte.
# Runners congelados: o replay v2 usa o hash dos dois arquivos na comparação pareada.
exclude = [
    "training/train_body_tri.py",
    "training/train_ink3.py",
    "tools/replay_reregister.py",
    "tools/replay_reregister_v2.py",
]

[tool.ruff.lint]
# Subconjunto de erro de verdade (nome indefinido, sintaxe, import
# quebrado). O estilo do repositório não é uniforme e uma regra
# ampla reprovaria o código atual inteiro; o CI usa este conjunto.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Corpos de treino da linhagem page-clean/tri: scripts gerados/
# vendados, fiéis ao original — imports no meio do arquivo fazem
# parte do desenho (o corpo nasce em estágios) e EMA_MODEL é
# resolvido no fluxo do próprio corpo. train_ink3.py é gerado
# por training/build_ink3_body.py; train_body_tri.py é a base
# vendada byte a byte. Não "consertar" o estilo deles aqui.
"training/train_ink3.py" = ["E402", "F821"]
"training/train_body_tri.py" = ["E402", "F821"]
